name: Native package portability
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run package:dir
        env:
          WORKBENCH_BUILD_SMOKE: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/test-packaged-portability.cjs
